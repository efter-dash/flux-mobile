name: Build and Release FLUX Mobile APK

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FLUX Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          fi

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare Named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk flux-mobile.apk
          ls -lh flux-mobile.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flux-mobile
          path: flux-mobile.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: "FLUX Mobile v1.1.0"
          make_latest: true
          body: |
            ## 📱 FLUX Mobile v1.1.0 for Android (Pixel 7 / Android 8.0+)
            
            **Direct Download:** Tap **`flux-mobile.apk`** below under **Assets** to download and install directly on your phone.
            
            ### ✨ What's New in v1.1.0:
            - 🌓 **Light Mode & Dark Mode**: Seamlessly switch between Light, Dark, or System Default themes anytime in Settings or with the quick toggle in the top bar.
            - 🚀 **First-Launch Onboarding**: New users are greeted with a prompt to set up their team workspace.
            - 🏢 **Multi-Workspace Selector**: Choose which workspace to enter on app launch and switch between workspaces anytime from the top bar.
            - 🎨 **Cleaner, More Readable UI**: Removed the oversized header from the Dashboard and optimized spacing, card contrast, and typography throughout the entire app.
            
            ### 📲 How to install on your Google Pixel 7:
            1. Tap **`flux-mobile.apk`** below to download.
            2. Open the **Files by Google** app and navigate to **Downloads**.
            3. Tap **`flux-mobile.apk`**. If prompted, tap **Settings** and toggle **Allow from this source**.
            4. Tap **Install**, then **Open**!
          files: flux-mobile.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

