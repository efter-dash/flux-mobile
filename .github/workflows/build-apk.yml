name: Build and Release FLUX Mobile APK

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build FLUX Mobile APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Debug Keystore if missing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000 -keyalg RSA -keysize 2048
          fi

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare Named APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk flux-mobile.apk
          ls -lh flux-mobile.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flux-mobile
          path: flux-mobile.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Delete local/remote tag if already present to ensure clean update
          git tag -f v1.0.0 || true
          
          gh release create v1.0.0 flux-mobile.apk \
            --title "FLUX Mobile v1.0.0" \
            --notes "### 📱 FLUX Mobile for Android (Pixel 7 / Android 8.0+)

          **Download:** Tap **\`flux-mobile.apk\`** below to download and install directly on your Pixel 7.

          #### How to install on your Google Pixel 7:
          1. Tap **\`flux-mobile.apk\`** below to download.
          2. Open the **Files by Google** app and navigate to **Downloads**.
          3. Tap **\`flux-mobile.apk\`**. If prompted, tap **Settings** and toggle **Allow from this source**.
          4. Tap **Install**, then **Open**!" \
            --clobber
